[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new_agentic_loop"
version = "0.1.0"
description = "AI project scaffold for new_agentic_loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["integrations*", "configs*", "core*", "schemas*", "agents*", "packages*"]
